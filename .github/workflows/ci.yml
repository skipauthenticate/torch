name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install clang-format==19.1.7
      - run: git ls-files '*.h' '*.cpp' '*.cu' '*.cuh' | xargs clang-format --dry-run -Werror

  host-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, cc: gcc-13, cxx: g++-13, sanitize: OFF, type: Release }
          - { os: ubuntu-24.04, cc: clang-18, cxx: clang++-18, sanitize: ON, type: Debug }
          - { os: macos-15, cc: clang, cxx: clang++, sanitize: OFF, type: Release }
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libclang-rt-18-dev
      - if: runner.os == 'macOS'
        run: brew install ninja
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
      - run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.type }} -DTORCH_CUDA=OFF
          -DTORCH_WERROR=ON -DTORCH_SANITIZE=${{ matrix.sanitize }}
      - run: cmake --build build
      - run: ctest --test-dir build -L unit --output-on-failure

  fixtures-reproducible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r tests/fixtures/requirements.txt
      - run: python tests/fixtures/make_fixtures.py --out "$RUNNER_TEMP/fixtures"
      - run: |
          cmp "$RUNNER_TEMP/fixtures/quant_blocks.bin" tests/fixtures/quant_blocks.bin
          cmp "$RUNNER_TEMP/fixtures/tiny.gguf" tests/fixtures/tiny.gguf
      - run: python tests/tools/make_draft_test.py
      - run: python tests/tools/run_workloads_test.py

  # The tokenizer export on the real header: the first 11 MiB of shard 1 at the pinned revision (docs/model-files.md),
  # fetched by range request and cached by revision. Nothing of the model is in the repository; the goldens are ids
  # of texts that are.
  tokenizer-export:
    runs-on: ubuntu-24.04
    env:
      HEADER_URL: https://huggingface.co/ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF/resolve/ed59f92082b1e93c0e96d60a8b11aab089b52f09/IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00001-of-00002.gguf
      HEADER_SHA256: d9565390beaba837e3146374b72356372a0a08e00f0a306a1054d87453e02dab
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/gguf-header
          key: gguf-header-ed59f92082b1e93c0e96d60a8b11aab089b52f09
      - run: |
          mkdir -p ~/gguf-header
          f=~/gguf-header/shard1-11MiB.gguf
          [ -f "$f" ] || curl --fail --silent --show-error --location --retry 5 -r 0-11534335 -o "$f" "$HEADER_URL"
          echo "$HEADER_SHA256  $f" | sha256sum -c -
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTORCH_CUDA=OFF -DTORCH_WERROR=ON
      - run: cmake --build build --target torch
      - run: ./build/torch inspect --header-only --export-tokenizer "$RUNNER_TEMP/tokenizer" ~/gguf-header/shard1-11MiB.gguf
      - run: pip install --no-deps --require-hashes -r server/requirements.txt
      - run: python tests/tools/tokenizer_export_test.py "$RUNNER_TEMP/tokenizer"

  # torch_server against the stub engine (tests/server/stub_engine.c, the C API without a model) and the exported
  # tokenizer, on both architectures the server ships for.
  server:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      HEADER_URL: https://huggingface.co/ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-GGUF/resolve/ed59f92082b1e93c0e96d60a8b11aab089b52f09/IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00001-of-00002.gguf
      HEADER_SHA256: d9565390beaba837e3146374b72356372a0a08e00f0a306a1054d87453e02dab
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/gguf-header
          key: gguf-header-ed59f92082b1e93c0e96d60a8b11aab089b52f09
      - run: |
          mkdir -p ~/gguf-header
          f=~/gguf-header/shard1-11MiB.gguf
          [ -f "$f" ] || curl --fail --silent --show-error --location --retry 5 -r 0-11534335 -o "$f" "$HEADER_URL"
          echo "$HEADER_SHA256  $f" | sha256sum -c -
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTORCH_CUDA=OFF -DTORCH_WERROR=ON
      - run: cmake --build build --target torch torch_engine_stub
      - run: ./build/torch inspect --header-only --export-tokenizer "$RUNNER_TEMP/tokenizer" ~/gguf-header/shard1-11MiB.gguf
      - run: pip install --no-deps --require-hashes -r server/requirements.txt
      - run: python -m unittest discover -s tests/server -v
        env:
          TORCH_ENGINE_LIBRARY: build/tests/libtorch_engine_stub.so
          TORCH_TOKENIZER_DIR: ${{ runner.temp }}/tokenizer

  # The installer: shellcheck, its system checks without the Jetson ones, and the hashes it uses against the docs.
  install-script:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ninja-build shellcheck
      - run: shellcheck scripts/install.sh
      - run: scripts/install.sh --check --no-gpu-check
      - run: |
          while read -r sha name; do
            grep -qF "$sha" docs/model-files.md && grep -qF "$name" docs/model-files.md ||
              { echo "docs/model-files.md does not show $name and $sha"; exit 1; }
          done < scripts/models.sha256

  fuzz:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libclang-rt-18-dev
      - run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTORCH_CUDA=OFF
          -DTORCH_FUZZ=ON -DTORCH_SANITIZE=ON
      - run: cmake --build build --target gguf_fuzz
      # The seed is the fixture; new inputs go to a scratch corpus, not into the repository.
      - run: |
          mkdir -p "$RUNNER_TEMP/corpus"
          cp tests/fixtures/tiny.gguf "$RUNNER_TEMP/corpus/"
          ./build/tests/gguf_fuzz -max_total_time=60 "$RUNNER_TEMP/corpus"

  wording:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: python3 tools/check_wording.py
      - run: git log --format=%B | python3 tools/check_wording.py --stdin
      # The history before 2026-11-04 was replaced by one clean root commit; a branch that still carries it must not
      # merge it back.
      - run: "! git cat-file -e a0baa2c6c286329eb1d5fdd50fbfb3a33583977b^{commit}"
